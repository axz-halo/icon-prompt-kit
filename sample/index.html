<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daum Graphic System — 사내 제품 프로토타입</title>
<style>
  :root {
    --bg: #0E0E10; --panel: #17171A; --panel-2: #1E1E22;
    --line: #2A2A2E; --line-2: #3A3A40;
    --ink: #ECECEF; --ink-2: #A3A3AC; --ink-3: #6E6E78;
    --action: #4C8DF5; --ok: #3BA55D; --warn: #E8B33E; --bad: #E5484D;
    --tile: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Apple SD Gothic Neo", Pretendard, system-ui, sans-serif; line-height: 1.5; }
  button, select, input, textarea { font-family: inherit; }
  button { cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }

  /* 상단 바 */
  .top { display: flex; align-items: center; gap: 14px; padding: 12px 20px;
    background: rgba(14,14,16,0.9); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  .brand { font-size: 15px; font-weight: 800; }
  .brand span { font-size: 10px; color: var(--ink-3); margin-left: 8px; letter-spacing: 0.1em;
    font-family: ui-monospace, Menlo, monospace; }
  .apps { display: flex; border: 1px solid var(--line-2); border-radius: 999px; overflow: hidden; }
  .apps button { border: 0; background: transparent; color: var(--ink-2); padding: 7px 18px; font-size: 13px; font-weight: 700; }
  .apps button.on { background: var(--ink); color: var(--bg); }
  .apps button:disabled { color: var(--ink-3); cursor: not-allowed; }
  .spacer { flex: 1; }
  .rolebox { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); }
  .rolebox select { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line-2);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; font-weight: 700; }
  .verpill { font-size: 11px; font-weight: 700; border: 1px solid var(--ok); color: var(--ok);
    border-radius: 999px; padding: 4px 10px; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 20px 90px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  .tabs button { border: 1px solid transparent; background: transparent; color: var(--ink-2);
    border-radius: 999px; padding: 7px 15px; font-size: 13px; font-weight: 700; }
  .tabs button.on { background: var(--panel-2); border-color: var(--line-2); color: var(--ink); }
  .tabs .badge-n { font-size: 10.5px; color: var(--ink-3); margin-left: 5px; font-family: ui-monospace, Menlo, monospace; }

  h2 { font-size: 20px; font-weight: 800; margin: 0 0 4px; }
  .lede { font-size: 13px; color: var(--ink-2); margin: 0 0 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 12px; font-size: 14px; font-weight: 800; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 180px; }
  input[type=text], textarea, select.full {
    background: var(--panel-2); color: var(--ink); border: 1px solid var(--line-2);
    border-radius: 10px; padding: 10px 12px; font-size: 13px; width: 100%;
  }
  textarea { min-height: 92px; resize: vertical; font-size: 11.5px; line-height: 1.6;
    font-family: ui-monospace, Menlo, monospace; color: var(--ink-2); }
  .btn { border: 0; border-radius: 10px; padding: 10px 18px; font-size: 13px; font-weight: 800; }
  .btn.primary { background: var(--ink); color: var(--bg); }
  .btn.ghost { background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--line-2); }
  .btn.ok { background: var(--ok); color: #fff; }
  .btn.bad { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
  .note { font-size: 11.5px; color: var(--ink-3); }

  .grid4 { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--tile); border-radius: 12px; aspect-ratio: 1; position: relative; overflow: hidden; }
  .tile img { position: absolute; inset: 12%; width: 76%; height: 76%; object-fit: contain; }
  .tile .qa { position: absolute; top: 8px; left: 8px; font-size: 10px; font-weight: 800;
    border-radius: 6px; padding: 3px 8px; color: #fff; }
  .qa.pass { background: var(--ok); } .qa.warn { background: var(--warn); color: #241c00; }
  .tile .acts { position: absolute; bottom: 8px; right: 8px; display: flex; gap: 6px; opacity: 0; }
  .tile:hover .acts { opacity: 1; }
  .tile .acts button, .tile .acts a { background: rgba(14,14,16,0.78); color: #fff; border: 0;
    border-radius: 7px; padding: 5px 9px; font-size: 10.5px; font-weight: 700; text-decoration: none; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--ink-3); font-size: 11px; font-weight: 700; }
  .pill { display: inline-block; font-size: 10.5px; font-weight: 800; border-radius: 999px; padding: 3px 9px; border: 1px solid; }
  .pill.draft { color: var(--warn); border-color: var(--warn); }
  .pill.review { color: var(--action); border-color: var(--action); }
  .pill.approved { color: var(--ok); border-color: var(--ok); }
  .pill.rejected { color: var(--bad); border-color: var(--bad); }
  .pill.pending { color: var(--ink-2); border-color: var(--line-2); }

  .diff { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .diff .side { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .diff .side h4 { margin: 0 0 8px; font-size: 12px; font-weight: 800; color: var(--ink-2); }
  .del { color: #F7A3A6; text-decoration: line-through; }
  .add { color: #9BE7B4; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line);
    background: var(--panel-2); border-radius: 999px; padding: 3px 10px 3px 4px; font-size: 10.5px;
    font-family: ui-monospace, Menlo, monospace; color: var(--ink-2); }
  .chip b { width: 15px; height: 15px; border-radius: 50%; }
  .stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat .s { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .stat .s .k { font-size: 11px; color: var(--ink-3); }
  .stat .s .v { font-size: 22px; font-weight: 800; margin-top: 4px; }
  .empty { color: var(--ink-3); font-size: 13px; padding: 26px 0; text-align: center; }
  .banner { border-left: 3px solid var(--action); background: var(--panel-2); border-radius: 0 10px 10px 0;
    padding: 11px 14px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 14px; }
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 18px);
    background: var(--ink); color: var(--bg); border-radius: 999px; padding: 9px 20px;
    font-size: 13px; font-weight: 700; opacity: 0; pointer-events: none; transition: all .18s; z-index: 90; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 720px) { .diff { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="top">
  <div class="brand">Daum Graphic System<span>PROTOTYPE</span></div>
  <div class="apps">
    <button id="app-studio" class="on">스튜디오</button>
    <button id="app-admin">어드민</button>
  </div>
  <div class="spacer"></div>
  <span class="verpill" id="live-ver">배포 v1.0</span>
  <div class="rolebox">
    <span>롤 시뮬레이션</span>
    <select id="role">
      <option value="member">Member · 전사</option>
      <option value="reviewer">Reviewer · 디자인팀</option>
      <option value="owner">Owner · 디자인 리드</option>
    </select>
  </div>
</div>

<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>
<div id="toast" role="status"></div>

<script>
/* ─────────── 상태(프로토타입: localStorage가 서버 DB 역할) ─────────── */
const KEY = "dgs-proto-v1";
const PALETTE_V1 = ["#E94B35","#F2C500","#F59D00","#8BC02F","#42A141","#EBEBEB","#BEBEBE","#323232","#05A9E3","#8D5836"];
const seed = () => ({
  specs: [{
    version: "v1.0", status: "approved", author: "디자인팀", approvedBy: "디자인 리드", createdAt: Date.now() - 86400000 * 12,
    reason: "초기 배포 — 기초 그래픽 75종 실측 기준",
    palette: PALETTE_V1,
    rules: [
      "메인 컬러 1색(60~80%) + 그레이 보조 + 포인트 소량",
      "외곽선·그라디언트·그림자 없음, 모든 모서리 라운드",
      "디테일은 #EBEBEB 라운드 마크 1~3개, 도형 4개 내외",
    ],
    coreMJ: ", solid flat fills, one dominant color with light gray #EBEBEB secondary parts, chunky rounded blob shapes, fully rounded line caps, minimal flat icon set style, isolated on pure white background, centered, about 10% margin --ar 1:1 --v 8.1 --style raw --s 50 --no outline, gradient, shadow, 3d, texture, text",
  }],
  requests: [
    { id: "rq-1", subject: "돛단배", by: "마케팅 김OO", at: Date.now() - 3600000 * 5, status: "pending", qa: "pass", specVer: "v1.0" },
    { id: "rq-2", subject: "등대", by: "기획 이OO", at: Date.now() - 3600000 * 26, status: "pending", qa: "warn", specVer: "v1.0",
      qaNote: "팔레트 외 색 1개(#2F9E8F) 감지" },
  ],
  library: [
    { id: "lb-1", subject: "커피", by: "디자인팀", at: Date.now() - 86400000 * 3, downloads: 24 },
  ],
  events: { generated: 148, downloads: 61 },
});
let DB = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || seed(); } catch { return seed(); } })();
const save = () => localStorage.setItem(KEY, JSON.stringify(DB));

let app = "studio", tab = "gen", role = "member";
const liveSpec = () => [...DB.specs].reverse().find((s) => s.status === "approved");
const draftSpec = () => DB.specs.find((s) => s.status === "draft" || s.status === "review");
const can = (r) => ({ member: 1, reviewer: 2, owner: 3 })[role] >= ({ member: 1, reviewer: 2, owner: 3 })[r];

function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1600); }
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const fmt = (ts) => new Date(ts).toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });

/* ─────────── 데모 아이콘 렌더 (스펙 팔레트를 실제로 반영) ─────────── */
function demoSvg(subject, palette, i) {
  let h = 0; for (const ch of subject + i) h = (h * 31 + ch.charCodeAt(0)) % 99991;
  const main = palette[h % Math.min(palette.length, 5)];
  const gray = palette.find((c) => c.toUpperCase() === "#EBEBEB") || "#EBEBEB";
  const shapes = [
    `<circle cx="256" cy="268" r="150" fill="${main}"/>`,
    `<rect x="110" y="140" width="292" height="250" rx="60" fill="${main}"/>`,
    `<path d="M256 96 C 372 176 396 268 372 336 C 348 408 300 440 256 440 C 212 440 164 408 140 336 C 116 268 140 176 256 96 Z" fill="${main}"/>`,
  ];
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    ${shapes[h % 3]}
    <path d="M196 208 q-18 34 4 66" fill="none" stroke="${gray}" stroke-width="26" stroke-linecap="round"/>
    <circle cx="316" cy="300" r="15" fill="${gray}"/>
  </svg>`;
}
const svgUrl = (s) => `data:image/svg+xml;charset=utf-8,${encodeURIComponent(s)}`;

/* ─────────── 자동 QA 린터 (승인 게이트의 근거) ─────────── */
function lint(svg, spec) {
  const hexes = [...new Set((svg.match(/#[0-9A-Fa-f]{6}/g) || []).map((h) => h.toUpperCase()))];
  const pal = spec.palette.map((p) => p.toUpperCase());
  const off = hexes.filter((h) => !pal.includes(h));
  const issues = [];
  if (off.length) issues.push(`팔레트 외 색 ${off.length}개 (${off.slice(0, 2).join(", ")})`);
  if (/gradient/i.test(svg)) issues.push("그라디언트 감지");
  if (/stroke-width="[1-9]"/.test(svg) === false && /stroke=/.test(svg) === false) { /* ok */ }
  if (hexes.length > 5) issues.push(`색 ${hexes.length}개 — 규칙(최대 5) 초과`);
  return { pass: issues.length === 0, issues };
}

/* ─────────── 라우팅 ─────────── */
const TABS = {
  studio: [["gen", "생성"], ["lib", "라이브러리"], ["mine", "내 요청"]],
  admin: [["approve", "가이드 승인"], ["review", "에셋 검수"], ["insert", "무드 삽입"], ["dash", "대시보드"]],
};
function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = "";
  TABS[app].forEach(([id, label]) => {
    const n = id === "review" ? DB.requests.filter((r) => r.status === "pending").length
      : id === "approve" ? DB.specs.filter((s) => s.status !== "approved" && s.status !== "rejected").length : 0;
    const b = document.createElement("button");
    b.className = tab === id ? "on" : "";
    b.innerHTML = label + (n ? `<span class="badge-n">${n}</span>` : "");
    b.onclick = () => { tab = id; render(); };
    el.appendChild(b);
  });
}
function render() {
  document.getElementById("live-ver").textContent = `배포 ${liveSpec().version}`;
  document.getElementById("app-studio").className = app === "studio" ? "on" : "";
  document.getElementById("app-admin").className = app === "admin" ? "on" : "";
  document.getElementById("app-admin").disabled = !can("reviewer");
  if (!TABS[app].some(([id]) => id === tab)) tab = TABS[app][0][0];
  renderTabs();
  const v = document.getElementById("view");
  v.innerHTML = ({ gen: viewGen, lib: viewLib, mine: viewMine,
    approve: viewApprove, review: viewReview, insert: viewInsert, dash: viewDash })[tab]();
  (({ gen: bindGen, lib: () => {}, mine: () => {},
    approve: bindApprove, review: bindReview, insert: bindInsert, dash: () => {} })[tab])();
}

/* ─────────── 스튜디오: 생성 ─────────── */
let genResults = [];
function viewGen() {
  const s = liveSpec();
  return `
    <h2>아이콘 생성</h2>
    <p class="lede">승인된 가이드 <b>${s.version}</b>을 자동으로 적용해요. 가이드는 디자인팀만 변경할 수 있어요.</p>
    <div class="banner">적용 중인 규칙 — ${s.rules[0]} · 자동 QA가 규격 이탈을 걸러줘요.</div>
    <div class="card">
      <div class="row">
        <input type="text" id="g-kw" class="grow" placeholder="만들 아이콘 주제 (예: 돛단배, 등대, 자전거)">
        <button class="btn primary" id="g-run">생성</button>
      </div>
      <div class="note" style="margin-top:10px">프롬프트·이미지 생성은 승인된 가이드 ${s.version} 기준으로 서버에서 처리됩니다 (프로토타입에서는 데모 렌더).</div>
    </div>
    <div id="g-out"></div>`;
}
function bindGen() {
  const run = () => {
    const kw = document.getElementById("g-kw").value.trim();
    if (!kw) { toast("주제를 입력하세요"); return; }
    const s = liveSpec();
    genResults = [0, 1, 2, 3].map((i) => {
      let svg = demoSvg(kw, s.palette, i);
      if (i === 3) {
        // 규격 이탈 케이스 데모: 실제 사용된 메인 색을 팔레트 외 색으로 치환
        const used = (svg.match(/#[0-9A-Fa-f]{6}/g) || []).find((h) => h.toUpperCase() !== "#EBEBEB");
        if (used) svg = svg.split(used).join("#2F9E8F");
      }
      return { svg, kw, qa: lint(svg, s) };
    });
    DB.events.generated += 4; save();
    document.getElementById("g-out").innerHTML = `
      <div class="card">
        <h3>“${esc(kw)}” 결과 — 가이드 ${s.version} · 자동 QA 적용</h3>
        <div class="grid4">
          ${genResults.map((r, i) => `
            <div class="tile">
              <span class="qa ${r.qa.pass ? "pass" : "warn"}">${r.qa.pass ? "QA 통과" : "경고"}</span>
              <img src="${svgUrl(r.svg)}" alt="${esc(kw)} ${i + 1}">
              <span class="acts">
                <a download="${esc(kw)}-${i + 1}.svg" href="${svgUrl(r.svg)}">SVG</a>
                <button data-req="${i}">승인 요청</button>
              </span>
            </div>`).join("")}
        </div>
        ${genResults.some((r) => !r.qa.pass) ? `<div class="note" style="margin-top:10px">⚠ ${genResults.filter(r=>!r.qa.pass).map(r=>r.qa.issues.join(", ")).join(" / ")}</div>` : ""}
      </div>`;
    document.querySelectorAll("[data-req]").forEach((b) => b.onclick = () => {
      const r = genResults[Number(b.dataset.req)];
      DB.requests.unshift({ id: "rq-" + Date.now().toString(36), subject: r.kw, by: "나 (Member)", at: Date.now(),
        status: "pending", qa: r.qa.pass ? "pass" : "warn", qaNote: r.qa.issues.join(", "), specVer: liveSpec().version, svg: r.svg });
      save(); toast("승인 요청을 보냈어요 — 디자인팀 검수 후 라이브러리에 공개돼요"); render();
    });
  };
  document.getElementById("g-run").onclick = run;
  document.getElementById("g-kw").onkeydown = (e) => { if (e.key === "Enter") run(); };
}

/* ─────────── 스튜디오: 라이브러리 / 내 요청 ─────────── */
function viewLib() {
  return `<h2>라이브러리</h2><p class="lede">승인된 에셋만 공개돼요 — 만들기 전에 먼저 찾아보세요.</p>
    <div class="card">${DB.library.length ? `<div class="grid4">${DB.library.map((l) => `
      <div class="tile"><img src="${svgUrl(l.svg || demoSvg(l.subject, liveSpec().palette, 0))}" alt="${esc(l.subject)}">
      <span class="qa pass">승인</span></div>`).join("")}</div>
      <div class="note" style="margin-top:10px">${DB.library.map((l) => `${esc(l.subject)} · ↓${l.downloads}`).join(" | ")}</div>`
      : `<div class="empty">아직 승인된 에셋이 없어요</div>`}</div>`;
}
function viewMine() {
  const rows = DB.requests.filter((r) => r.by.startsWith("나"));
  return `<h2>내 요청</h2><p class="lede">내가 올린 승인 요청의 상태를 추적해요.</p>
    <div class="card">${rows.length ? `<table><thead><tr><th>주제</th><th>QA</th><th>상태</th><th>요청 시각</th><th>사유</th></tr></thead><tbody>
      ${rows.map((r) => `<tr><td><b>${esc(r.subject)}</b></td>
        <td><span class="pill ${r.qa === "pass" ? "approved" : "draft"}">${r.qa === "pass" ? "통과" : "경고"}</span></td>
        <td><span class="pill ${r.status}">${({pending:"검수 대기",approved:"승인",rejected:"반려"})[r.status]}</span></td>
        <td class="note">${fmt(r.at)}</td><td class="note">${esc(r.note || r.qaNote || "—")}</td></tr>`).join("")}
      </tbody></table>` : `<div class="empty">요청 이력이 없어요 — [생성]에서 결과를 만들고 승인 요청해 보세요</div>`}</div>`;
}

/* ─────────── 어드민: 가이드 승인 (핵심) ─────────── */
function viewApprove() {
  const live = liveSpec(), d = draftSpec();
  const history = DB.specs.filter((s) => s.status === "approved").reverse();
  const diffPalette = d ? {
    added: d.palette.filter((p) => !live.palette.includes(p)),
    removed: live.palette.filter((p) => !d.palette.includes(p)),
  } : null;
  return `
    <h2>가이드 승인</h2>
    <p class="lede">Draft → 리뷰 → 승인 → 전사 배포. 승인 권한은 <b>Owner(디자인 리드)</b>만 가져요.</p>
    ${!d ? `<div class="banner">현재 대기 중인 초안이 없어요 — [무드 삽입]에서 새 그래픽을 올리면 초안이 생성됩니다.</div>` : `
    <div class="card">
      <div class="row" style="margin-bottom:14px">
        <h3 style="margin:0">초안 ${d.version} <span class="pill ${d.status}">${d.status === "draft" ? "Draft" : "리뷰 중"}</span></h3>
        <span class="note">작성 ${d.author} · ${fmt(d.createdAt)}</span>
        <div class="spacer"></div>
        <button class="btn ghost" id="ap-preview">미리보기 대조</button>
        <button class="btn bad" id="ap-reject" ${can("owner") ? "" : "disabled"}>반려</button>
        <button class="btn ok" id="ap-approve" ${can("owner") ? "" : "disabled"}>승인 & 배포</button>
      </div>
      ${!can("owner") ? `<div class="note" style="margin-bottom:12px">🔒 승인·반려는 Owner 롤에서만 가능해요 (상단에서 롤을 바꿔 체험해 보세요).</div>` : ""}
      <div class="diff">
        <div class="side"><h4>현재 배포 ${live.version}</h4>
          <div class="chips">${live.palette.map((p) => `<span class="chip"><b style="background:${p}"></b>${p}</span>`).join("")}</div>
          <div class="note" style="margin-top:10px">${live.rules.map((r) => `· ${esc(r)}`).join("<br>")}</div>
        </div>
        <div class="side"><h4>초안 ${d.version}</h4>
          <div class="chips">${d.palette.map((p) => `<span class="chip" ${diffPalette.added.includes(p) ? 'style="border-color:var(--ok)"' : ""}><b style="background:${p}"></b>${p}</span>`).join("")}</div>
          <div class="note" style="margin-top:10px">${d.rules.map((r) => `· ${live.rules.includes(r) ? esc(r) : `<span class="add">${esc(r)}</span>`}`).join("<br>")}</div>
        </div>
      </div>
      <div class="note" style="margin-top:12px">
        변경 요약: 팔레트 <span class="add">+${diffPalette.added.length}</span> / <span class="del">-${diffPalette.removed.length}</span>
        ${diffPalette.added.length ? ` (추가: ${diffPalette.added.join(", ")})` : ""}
        ${diffPalette.removed.length ? ` (제거: ${diffPalette.removed.join(", ")})` : ""}
        · 사유: ${esc(d.reason || "—")}
      </div>
      <div id="ap-out"></div>
    </div>`}
    <div class="card">
      <h3>배포 이력</h3>
      <table><thead><tr><th>버전</th><th>상태</th><th>승인자</th><th>일시</th><th>사유</th><th></th></tr></thead><tbody>
        ${history.map((s, i) => `<tr>
          <td class="mono"><b>${s.version}</b></td>
          <td>${i === 0 ? `<span class="pill approved">배포 중</span>` : `<span class="pill pending">이전</span>`}</td>
          <td class="note">${esc(s.approvedBy || "—")}</td>
          <td class="note">${fmt(s.createdAt)}</td>
          <td class="note">${esc(s.reason || "—")}</td>
          <td>${i !== 0 && can("owner") ? `<button class="btn ghost" data-rb="${s.version}">이 버전으로 롤백</button>` : ""}</td>
        </tr>`).join("")}
      </tbody></table>
    </div>`;
}
function bindApprove() {
  const d = draftSpec();
  if (d) {
    document.getElementById("ap-preview").onclick = () => {
      const live = liveSpec();
      document.getElementById("ap-out").innerHTML = `
        <h3 style="margin:18px 0 10px">미리보기 대조 — 같은 주제를 두 버전으로 생성</h3>
        <div class="diff">
          <div class="side"><h4>${live.version} (현재)</h4><div class="grid4">
            ${["돛단배","등대","커피"].map((k) => `<div class="tile"><img src="${svgUrl(demoSvg(k, live.palette, 0))}"></div>`).join("")}
          </div></div>
          <div class="side"><h4>${d.version} (초안)</h4><div class="grid4">
            ${["돛단배","등대","커피"].map((k) => `<div class="tile"><img src="${svgUrl(demoSvg(k, d.palette, 0))}"></div>`).join("")}
          </div></div>
        </div>
        <div class="note" style="margin-top:10px">텍스트 diff만으로는 결과 변화를 알 수 없어서, 승인 전 시각 대조가 게이트의 핵심이에요.</div>`;
    };
    document.getElementById("ap-approve").onclick = () => {
      if (!can("owner")) return;
      d.status = "approved"; d.approvedBy = "디자인 리드 (나)"; d.createdAt = Date.now();
      save(); toast(`${d.version} 승인 — 전사 스튜디오에 즉시 반영됐어요`); render();
    };
    document.getElementById("ap-reject").onclick = () => {
      if (!can("owner")) return;
      d.status = "rejected"; save(); toast("초안을 반려했어요"); render();
    };
  }
  document.querySelectorAll("[data-rb]").forEach((b) => b.onclick = () => {
    const target = DB.specs.find((s) => s.version === b.dataset.rb);
    const clone = { ...target, version: bumpVer(), status: "approved", approvedBy: "디자인 리드 (롤백)",
      createdAt: Date.now(), reason: `${target.version}으로 롤백` };
    DB.specs.push(clone); save(); toast(`${target.version} 내용으로 롤백했어요 (${clone.version} 발행)`); render();
  });
}
function bumpVer() {
  const nums = DB.specs.map((s) => Number(s.version.replace("v", "").split(".")[1] || 0));
  return `v1.${Math.max(...nums) + 1}`;
}

/* ─────────── 어드민: 에셋 검수 ─────────── */
function viewReview() {
  const q = DB.requests.filter((r) => r.status === "pending");
  return `<h2>에셋 검수</h2><p class="lede">전사에서 올라온 승인 요청 — 승인하면 라이브러리에 공개되고 학습 데이터로 편입돼요.</p>
    <div class="card">${q.length ? `<table><thead><tr><th>주제</th><th>요청자</th><th>자동 QA</th><th>가이드</th><th>요청</th><th></th></tr></thead><tbody>
      ${q.map((r) => `<tr>
        <td><b>${esc(r.subject)}</b></td><td class="note">${esc(r.by)}</td>
        <td>${r.qa === "pass" ? `<span class="pill approved">통과</span>` : `<span class="pill draft">경고</span><div class="note">${esc(r.qaNote || "")}</div>`}</td>
        <td class="mono note">${r.specVer}</td><td class="note">${fmt(r.at)}</td>
        <td><button class="btn ok" data-ap="${r.id}" ${can("reviewer") ? "" : "disabled"}>승인</button>
            <button class="btn bad" data-rj="${r.id}" ${can("reviewer") ? "" : "disabled"}>반려</button></td>
      </tr>`).join("")}</tbody></table>` : `<div class="empty">검수 대기 항목이 없어요</div>`}</div>`;
}
function bindReview() {
  document.querySelectorAll("[data-ap]").forEach((b) => b.onclick = () => {
    const r = DB.requests.find((x) => x.id === b.dataset.ap);
    r.status = "approved"; r.note = "승인 — 라이브러리 공개";
    DB.library.unshift({ id: "lb-" + Date.now().toString(36), subject: r.subject, by: r.by, at: Date.now(), downloads: 0, svg: r.svg });
    save(); toast("승인 — 라이브러리에 공개했어요"); render();
  });
  document.querySelectorAll("[data-rj]").forEach((b) => b.onclick = () => {
    const r = DB.requests.find((x) => x.id === b.dataset.rj);
    r.status = "rejected"; r.note = "반려 — 팔레트 규격 이탈";
    save(); toast("반려했어요 (요청자에게 사유 전달)"); render();
  });
}

/* ─────────── 어드민: 무드 삽입 → 초안 생성 ─────────── */
function viewInsert() {
  return `<h2>무드 삽입</h2>
    <p class="lede">새 디자인을 올리면 LLM이 분석해 <b>가이드 초안(Draft)</b>을 만들어요 — 바로 배포되지 않고 승인을 거칩니다.</p>
    <div class="card">
      <div class="row">
        <input type="text" id="ins-hex" class="grow" placeholder="새로 추가된 색 (예: #2F9E8F, #7A5CD0) — 프로토타입 입력">
        <button class="btn primary" id="ins-run" ${can("reviewer") ? "" : "disabled"}>분석 & 초안 생성</button>
      </div>
      <div class="row" style="margin-top:10px">
        <input type="text" id="ins-rule" class="grow" placeholder="추가할 규칙 한 줄 (선택)">
      </div>
      <div class="note" style="margin-top:10px">실제 제품에서는 SVG/PNG 업로드 → 팔레트·형태 문법 자동 추출 → 병합 모드로 초안 작성 (지금 도구에 이미 구현된 로직 재사용)</div>
      <div id="ins-out"></div>
    </div>`;
}
function bindInsert() {
  document.getElementById("ins-run").onclick = () => {
    if (!can("reviewer")) return;
    const hexes = (document.getElementById("ins-hex").value.match(/#[0-9A-Fa-f]{6}/g) || []).map((h) => h.toUpperCase());
    const rule = document.getElementById("ins-rule").value.trim();
    if (!hexes.length && !rule) { toast("색 또는 규칙을 입력하세요"); return; }
    const live = liveSpec();
    DB.specs = DB.specs.filter((s) => s.status !== "draft" && s.status !== "review");
    DB.specs.push({
      version: bumpVer(), status: "draft", author: "디자인팀 (나)", createdAt: Date.now(),
      reason: "신규 그래픽 반영 초안",
      palette: [...new Set([...live.palette, ...hexes])],
      rules: rule ? [...live.rules, rule] : [...live.rules],
      coreMJ: live.coreMJ,
    });
    save(); toast("초안을 만들었어요 — [가이드 승인]에서 검토·승인하세요"); tab = "approve"; render();
  };
}

/* ─────────── 어드민: 대시보드 ─────────── */
function viewDash() {
  const pend = DB.requests.filter((r) => r.status === "pending").length;
  const appr = DB.requests.filter((r) => r.status === "approved").length;
  return `<h2>대시보드</h2><p class="lede">운영 지표 — 가이드 버전별 채택률까지 추적하면 스펙 개선 근거가 돼요.</p>
    <div class="card"><div class="stat">
      <div class="s"><div class="k">누적 생성</div><div class="v">${DB.events.generated}</div></div>
      <div class="s"><div class="k">검수 대기</div><div class="v">${pend}</div></div>
      <div class="s"><div class="k">승인 에셋</div><div class="v">${DB.library.length}</div></div>
      <div class="s"><div class="k">배포 가이드</div><div class="v">${liveSpec().version}</div></div>
    </div></div>
    <div class="card"><h3>가이드 버전 이력</h3>
      <table><thead><tr><th>버전</th><th>승인자</th><th>일시</th><th>사유</th></tr></thead><tbody>
      ${DB.specs.filter(s=>s.status==="approved").reverse().map((s) => `<tr><td class="mono">${s.version}</td>
        <td class="note">${esc(s.approvedBy||"—")}</td><td class="note">${fmt(s.createdAt)}</td><td class="note">${esc(s.reason||"—")}</td></tr>`).join("")}
      </tbody></table></div>`;
}

/* ─────────── 초기화 ─────────── */
document.getElementById("app-studio").onclick = () => { app = "studio"; tab = "gen"; render(); };
document.getElementById("app-admin").onclick = () => { if (!can("reviewer")) { toast("Reviewer 이상 롤이 필요해요"); return; } app = "admin"; tab = "approve"; render(); };
document.getElementById("role").onchange = (e) => {
  role = e.target.value;
  if (app === "admin" && !can("reviewer")) { app = "studio"; tab = "gen"; }
  render(); toast(`${e.target.selectedOptions[0].textContent} 롤로 전환`);
};
render();
</script>
</body>
</html>
